<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YMind — macOS 设计原型</title>
<style>
  :root{
    /* primitives — warm paper */
    --paper:#e7e4dc; --paper-deep:#d8d3c8; --ink:#1a1c19; --ink-muted:#5c6358;
    --panel:#f4f1ea; --node:#fbfaf6; --node-border:#c8c2b4;
    --root-fill:#1f2a24; --root-text:#f4f1ea;
    --accent:#2f6f5e; --accent-soft:rgba(47,111,94,.16);
    --danger:#9b3d2e; --line:#6d7568; --search-hit:#c4782a;
    --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
    --r-m:10px; --r-l:14px; --r-xl:18px; --r-pill:999px;
    --sh-1:0 1px 2px rgba(26,28,25,.12),0 4px 12px rgba(26,28,25,.08);
    --sh-2:0 2px 8px rgba(26,28,25,.10),0 14px 30px rgba(26,28,25,.14);
    --font-ui:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
    --font-display:-apple-system,"New York",Georgia,serif;
    --m-fast:120ms; --m-base:200ms;
    --titlebar-h:52px;
  }
  [data-theme="dark"]{
    --paper:#1a1a17; --paper-deep:#141411; --ink:#e9e6de; --ink-muted:#9aa091;
    --panel:#23231f; --node:#2b2b26; --node-border:#43423a;
    --root-fill:#2e3a32; --root-text:#e9e6de;
    --accent:#5ea98e; --accent-soft:rgba(94,169,142,.22);
    --danger:#d06a57; --line:#7d8375; --search-hit:#e29a4a;
    --sh-1:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
    --sh-2:0 2px 8px rgba(0,0,0,.5),0 14px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font-ui);color:var(--ink);background:var(--paper);
    overflow:hidden;-webkit-font-smoothing:antialiased}
  .win{display:flex;flex-direction:column;height:100vh}

  /* ===== unified titlebar + toolbar ===== */
  .titlebar{display:flex;align-items:center;gap:var(--space-3);height:var(--titlebar-h);
    padding:0 14px 0 14px;background:color-mix(in srgb,var(--panel) 92%,transparent);
    border-bottom:1px solid color-mix(in srgb,var(--node-border) 55%,transparent);
    backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    z-index:20;user-select:none}
  .traffic{display:flex;gap:8px;margin-right:6px;align-items:center}
  .tl{width:12px;height:12px;border-radius:50%}
  .tl-r{background:#ff5f57}.tl-y{background:#febc2e}.tl-g{background:#28c840}
  .tls{width:12px;height:12px;border-radius:50%;background:color-mix(in srgb,var(--ink) 18%,transparent)}
  .brand{display:flex;align-items:center;gap:.5rem;min-width:0}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:1.02rem;letter-spacing:-.02em;white-space:nowrap}
  .docname{color:var(--ink-muted);font-size:.78rem;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .titlebar .sep{width:1px;height:18px;background:color-mix(in srgb,var(--ink) 14%,transparent);flex:none}
  .spacer{flex:1}
  .toolbar{display:flex;align-items:center;gap:2px;flex:none}
  .tb{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;
    display:inline-flex;align-items:center;gap:.42rem;padding:4px 8px;border-radius:6px;cursor:pointer;
    font-size:.82rem;font-weight:500;height:28px;transition:background var(--m-fast) ease,color var(--m-fast) ease}
  .tb:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 9%,transparent)}
  .tb:active:not(:disabled){background:color-mix(in srgb,var(--ink) 14%,transparent)}
  .tb:disabled{opacity:.35;cursor:default}
  .tb.danger:hover:not(:disabled){background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
  .tb .ic{width:15px;height:15px;flex:none}
  .tb .kbd{font-size:.68rem;color:var(--ink-muted);font-weight:600;letter-spacing:.02em}
  .tb:hover:not(:disabled) .kbd{color:var(--ink-muted)}
  .tb.iconly{padding:4px 6px}
  /* swatches */
  .sw{width:16px;height:16px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);
    cursor:pointer;padding:0;transition:transform var(--m-fast) ease;position:relative;background:transparent}
  .sw:hover{transform:scale(1.15)}
  .sw:disabled{opacity:.35}
  .sw.on::after{content:"";position:absolute;inset:-4px;border:2px solid var(--accent);border-radius:50%}
  .sw.none{background:linear-gradient(135deg,transparent 46%,var(--danger) 48%,var(--danger) 52%,transparent 54%),var(--node)}
  .s-sage{background:#9db89a}.s-sky{background:#8fb6d6}.s-sand{background:#d8be82}.s-rose{background:#d8a49e}.s-lilac{background:#b6a3cc}
  [data-theme="dark"] .s-sage{background:#5f7d5c}[data-theme="dark"] .s-sky{background:#4f7291}
  [data-theme="dark"] .s-sand{background:#8a7340}[data-theme="dark"] .s-rose{background:#8a5550}[data-theme="dark"] .s-lilac{background:#6a5a80}
  .swgroup{display:flex;gap:6px;align-items:center;padding:0 2px}
  .zoom-label{min-width:2.6rem;text-align:center;font-size:.76rem;font-variant-numeric:tabular-nums;color:var(--ink-muted)}

  /* ===== canvas ===== */
  .stage{position:relative;flex:1;overflow:hidden;background-color:var(--paper);
    background-image:radial-gradient(circle,color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.4px);
    background-size:22px 22px}
  .world{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;
    transition:transform .3s cubic-bezier(.22,1,.36,1)}
  .edge{position:absolute;left:50%;top:50%;width:2000px;height:1200px;margin-left:-1000px;margin-top:-600px;
    overflow:visible;pointer-events:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;opacity:.6;fill:none}
  .node{position:absolute;transform:translate(-50%,-50%);padding:10px 16px;
    background:var(--node);border:1px solid var(--node-border);border-radius:var(--r-l);
    box-shadow:var(--sh-1);cursor:pointer;user-select:none;white-space:pre-wrap;max-width:188px;
    width:max-content;min-width:24px;
    transition:box-shadow var(--m-base) ease,border-color var(--m-base) ease,
      background var(--m-base) ease,transform var(--m-base) cubic-bezier(.22,1,.36,1),opacity var(--m-base) ease}
  .node:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--node-border))}
  .node.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--sh-1)}
  .node.root{background:var(--root-fill);border-color:var(--root-fill);color:var(--root-text);
    padding:14px 22px;border-radius:var(--r-xl);max-width:230px;box-shadow:var(--sh-2);
    font-family:var(--font-display);font-weight:700;font-size:1.12rem;letter-spacing:-.02em}
  .node.root.selected{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 50%,transparent),var(--sh-2)}
  .node.cut{opacity:.42;border-style:dashed}
  .node.dragging{opacity:.55}
  .node .ntext{font-size:.88rem;font-weight:500;line-height:1.35}
  .node.root .ntext{font-size:inherit}
  /* fills */
  .node.fill-sage{background:#dfeadf;border-color:#8fa88a}
  .node.fill-sky{background:#d7e5f0;border-color:#7a9bb5}
  .node.fill-sand{background:#f0e4c4;border-color:#c4a86a}
  .node.fill-rose{background:#f0d8d5;border-color:#c48984}
  .node.fill-lilac{background:#e5dced;border-color:#9e8bb3}
  .node.root.fill-sage{background:#3d5c48;border-color:#3d5c48;color:var(--root-text)}
  .node.root.fill-sky{background:#355a78;border-color:#355a78;color:var(--root-text)}
  .node.root.fill-sand{background:#7a6230;border-color:#7a6230;color:var(--root-text)}
  .node.root.fill-rose{background:#7a4040;border-color:#7a4040;color:var(--root-text)}
  .node.root.fill-lilac{background:#554868;border-color:#554868;color:var(--root-text)}
  [data-theme="dark"] .node.fill-sage{background:#3d4f3a;border-color:#5f7d5c;color:#e9e6de}
  [data-theme="dark"] .node.fill-sky{background:#33465c;border-color:#4f7291;color:#e9e6de}
  [data-theme="dark"] .node.fill-sand{background:#4e4427;border-color:#8a7340;color:#e9e6de}
  [data-theme="dark"] .node.fill-rose{background:#4d3130;border-color:#8a5550;color:#e9e6de}
  [data-theme="dark"] .node.fill-lilac{background:#3b3350;border-color:#6a5a80;color:#e9e6de}
  [data-theme="dark"] .node.root.fill-sage{background:#5f7d5c;border-color:#5f7d5c;color:#141411}
  [data-theme="dark"] .node.root.fill-sky{background:#4f7291;border-color:#4f7291;color:#141411}
  [data-theme="dark"] .node.root.fill-sand{background:#8a7340;border-color:#8a7340;color:#141411}
  [data-theme="dark"] .node.root.fill-rose{background:#8a5550;border-color:#8a5550;color:#141411}
  [data-theme="dark"] .node.root.fill-lilac{background:#6a5a80;border-color:#6a5a80;color:#141411}
  .node.search-hit{border-color:var(--search-hit);box-shadow:0 0 0 3px color-mix(in srgb,var(--search-hit) 30%,transparent),var(--sh-1)}
  /* collapse toggle */
  .btoggle{position:absolute;transform:translate(-50%,-50%);min-width:20px;height:20px;padding:0 4px;
    border:1px solid color-mix(in srgb,var(--accent) 55%,var(--node-border));border-radius:var(--r-pill);
    background:var(--node);color:var(--accent);font-size:.72rem;font-weight:600;line-height:1;
    display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(26,28,25,.12);
    transition:background var(--m-base) ease,border-color var(--m-base) ease,
      transform var(--m-base) cubic-bezier(.22,1,.36,1);z-index:4}
  .btoggle:hover{background:color-mix(in srgb,var(--accent-soft) 70%,transparent);border-color:var(--accent);transform:translate(-50%,-50%) scale(1.1)}
  .btoggle.collapsed{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ===== floating pills (top-right, over canvas) ===== */
  .pills{position:absolute;top:14px;right:16px;display:flex;gap:8px;z-index:15}
  .pill{display:inline-flex;align-items:center;gap:.45rem;padding:5px 12px;height:30px;
    border-radius:var(--r-pill);background:color-mix(in srgb,var(--panel) 88%,transparent);
    border:1px solid color-mix(in srgb,var(--node-border) 70%,transparent);
    color:var(--ink);font-size:.78rem;font-weight:500;cursor:pointer;box-shadow:var(--sh-1);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background var(--m-fast) ease}
  .pill:hover{background:color-mix(in srgb,var(--panel) 96%,transparent)}
  .pill .ic{width:13px;height:13px}
  .pill .kbd{font-size:.66rem;color:var(--ink-muted)}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill.on .kbd{color:rgba(255,255,255,.7)}

  /* ===== context menu ===== */
  .ctx{position:fixed;min-width:220px;background:color-mix(in srgb,var(--panel) 96%,transparent);
    border:1px solid var(--node-border);border-radius:var(--r-m);box-shadow:0 8px 30px rgba(0,0,0,.2);
    padding:5px;z-index:60;display:none;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .ctx.show{display:block;animation:mIn var(--m-base) cubic-bezier(.22,1,.36,1)}
  @keyframes mIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
  .ctx button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:0;background:transparent;
    color:var(--ink);font:inherit;font-size:.82rem;padding:.42rem .6rem;border-radius:6px;cursor:pointer}
  .ctx button:hover:not(:disabled){background:var(--accent);color:#fff}
  .ctx button:disabled{opacity:.35;cursor:default}
  .ctx button.danger{color:var(--danger)}
  .ctx button.danger:hover{background:var(--danger);color:#fff}
  .ctx .kbd{margin-left:auto;font-size:.7rem;color:var(--ink-muted)}
  .ctx button:hover .kbd{color:rgba(255,255,255,.75)}
  .ctx .csep{height:1px;background:color-mix(in srgb,var(--ink) 12%,transparent);margin:4px 6px}

  /* ===== bottom hint ===== */
  .hint{position:absolute;left:50%;bottom:1rem;transform:translateX(-50%);padding:6px 14px;height:30px;
    border-radius:var(--r-pill);background:color-mix(in srgb,var(--panel) 88%,transparent);
    border:1px solid var(--node-border);color:var(--ink-muted);font-size:.74rem;white-space:nowrap;
    display:flex;align-items:center;gap:6px;pointer-events:none;backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .5s;z-index:15}
  .hint.show{opacity:1}
  .hint .dot{width:4px;height:4px;border-radius:50%;background:color-mix(in srgb,var(--ink) 30%,transparent)}

  [data-motion="reduced"] .node,[data-motion="reduced"] .world{transition:none}
  [data-motion="reduced"] .btoggle{transition:none}
</style>
</head>
<body>
<div class="win">
  <!-- ===== unified titlebar + toolbar ===== -->
  <header class="titlebar">
    <div class="traffic"><span class="tl tl-r"></span><span class="tl tl-y"></span><span class="tl tl-g"></span></div>
    <div class="brand"><span class="brand-name">YMind</span><span class="docname">阅读清单.ymind</span></div>

    <div class="toolbar">
      <button class="tb" id="addChild" disabled><svg class="ic"><use href="#i-arrow.turn.down.right"/></svg>子主题<span class="kbd">Tab</span></button>
      <button class="tb" id="addSibling" disabled><svg class="ic"><use href="#i-plus.rectangle.on.rectangle"/></svg>同级主题<span class="kbd">⏎</span></button>
      <button class="tb danger" id="del" disabled><svg class="ic"><use href="#i-trash"/></svg>删除</button>
    </div>
    <div class="sep"></div>
    <div class="swgroup" id="swatches">
      <button class="sw s-sage" data-fill="sage" title="sage"></button>
      <button class="sw s-sky" data-fill="sky" title="sky"></button>
      <button class="sw s-sand" data-fill="sand" title="sand"></button>
      <button class="sw s-rose" data-fill="rose" title="rose"></button>
      <button class="sw s-lilac" data-fill="lilac" title="lilac"></button>
      <button class="sw none" data-fill="" title="清除"></button>
    </div>
    <div class="sep"></div>
    <div class="toolbar">
      <button class="tb iconly" id="setLeft" disabled title="移到左侧 ⌘←"><svg class="ic"><use href="#i-arrow.left.to.line"/></svg></button>
      <button class="tb iconly" id="setRight" disabled title="移到右侧 ⌘→"><svg class="ic"><use href="#i-arrow.right.to.line"/></svg></button>
    </div>

    <div class="spacer"></div>

    <div class="toolbar">
      <button class="tb iconly" id="zoomOut" title="缩小"><svg class="ic"><use href="#i-minus.magnifyingglass"/></svg></button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="tb iconly" id="zoomIn" title="放大"><svg class="ic"><use href="#i-plus.magnifyingglass"/></svg></button>
      <button class="tb iconly" id="fit" title="适应画布"><svg class="ic"><use href="#i-arrow.up.left.and.arrow.down.right"/></svg></button>
      <button class="tb iconly" id="moreBtn" title="更多"><svg class="ic"><use href="#i-ellipsis"/></svg></button>
    </div>
  </header>

  <!-- canvas -->
  <main class="stage" id="stage">
    <div class="world" id="world">
      <svg class="edge" id="edgeL" style="display:none"></svg>
      <div id="nodes"></div>
      <div id="toggles"></div>
    </div>

    <!-- floating pills -->
    <div class="pills">
      <button class="pill" id="searchPill"><svg class="ic"><use href="#i-magnifyingglass"/></svg>搜索<span class="kbd">⌘F</span></button>
      <button class="pill" id="themePill"><svg class="ic"><use href="#i-arrow.up.left.and.arrow.down.right"/></svg>暗色模式</button>
      <button class="pill" id="fitPill"><svg class="ic"><use href="#i-cursorarrow"/></svg>适应画布</button>
    </div>

    <div class="hint" id="hint"><span>右键节点看菜单</span><span class="dot"></span><span>点色点填色</span><span class="dot"></span><span>拖动搬枝</span></div>
  </main>
</div>

<!-- context menu -->
<div class="ctx" id="ctx"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  let selected = new Set();
  const ROOT = { id:'root', text:'阅读清单', root:true, side:null, fill:null, children:[
    {id:'a',text:'产品设计',fill:'sage',children:[{id:'a1',text:'Designing for macOS',fill:'sky'},{id:'a2',text:'HIG 指南'}]},
    {id:'b',text:'思维方法',side:'right',fill:'sand',children:[{id:'b1',text:'卡片笔记法'},{id:'b2',text:'费曼技巧'}]},
    {id:'c',text:'技术栈',side:'left',fill:'lilac',collapsed:true,children:[{id:'c1',text:'SwiftUI 壳'},{id:'c2',text:'Metal 画布',fill:'rose'}]},
    {id:'d',text:'待读',side:'left',children:[{id:'d1',text:'认知心理学'}]},
  ]};
  let flat = all(ROOT);
  function all(n,o=[]){o.push(n);(n.children||[]).forEach(c=>all(c,o));return o}

  // recursive subtree-height layout (mirrors RadialLayout)
  let pos = {};
  function subH(n,isRoot){
    const kids=n.children||[];
    const myH=isRoot?64:44;
    if(!kids.length) return {h:myH};
    const cH=kids.reduce((s,k)=>s+subH(k,false).h,0)+(kids.length-1)*18;
    return {h:Math.max(myH,cH)};
  }
  function layout(){
    pos={}; const w=150,hGap=120;
    pos[ROOT.id]={x:0,y:0};
    const rights=ROOT.children.filter(b=>b.side!=='left');
    const lefts=ROOT.children.filter(b=>b.side==='left');
    function place(list,dir){
      if(!list.length)return;
      const total=list.reduce((s,b)=>s+subH(b,false).h,0)+(list.length-1)*18;
      let y=-total/2;
      list.forEach(b=>{
        const bh=subH(b,false).h;
        pos[b.id]={x:dir*(w/2+hGap),y:y+bh/2};
        // children of b
        const kids=b.children||[];
        if(kids.length){
          const ct=kids.reduce((s,k)=>s+subH(k,false).h,0)+(kids.length-1)*18;
          let cy=pos[b.id].y-ct/2;
          kids.forEach(k=>{const kh=subH(k,false).h;pos[k.id]={x:pos[b.id].x+dir*(84+72),y:cy+kh/2};cy+=kh+18;});
        }
        y+=bh+18;
      });
    }
    place(rights,1); place(lefts,-1);
    return pos;
  }
  pos=layout();
  function parentOf(n){return flat.find(p=>(p.children||[]).includes(n));}
  function countDesc(n){return (n.children||[]).reduce((s,c)=>s+1+countDesc(c),0);}
  function isHidden(n){ // 是否有折叠祖先
    let p=parentOf(n);
    while(p){ if(p.collapsed) return true; p=parentOf(p); }
    return false;
  }
  function visible(){ return flat.filter(n=>n.root||!isHidden(n)); }

  // 真实节点宽（max-content 渲染后测量）；用于把分叉控件/连线锚到节点实际边缘
  let nw = {};
  function measure(){
    nw = {};
    document.querySelectorAll('#nodes .node').forEach(el=>{
      nw[el.dataset.id] = el.offsetWidth;
    });
  }
  // 宽感知布局：子节点 x 锚到父节点实际边缘 + 间距，分叉控件/连线也吃真实宽
  function relayout(){
    pos = {};
    pos[ROOT.id] = {x:0,y:0};
    const rights = ROOT.children.filter(b=>b.side!=='left');
    const lefts  = ROOT.children.filter(b=>b.side==='left');
    const hGap = 120;
    function place(list, dir){
      if(!list.length) return;
      const total = list.reduce((s,b)=>s+subH(b,false).h,0)+(list.length-1)*18;
      let y = -total/2;
      list.forEach(b=>{
        const bh = subH(b,false).h;
        const parentEdge = pos[ROOT.id].x + dir*((nw[ROOT.id]||150)/2);
        pos[b.id] = {x: parentEdge + dir*(hGap + (nw[b.id]||80)/2), y:y+bh/2};
        const kids = b.children||[];
        if(kids.length){
          const ct = kids.reduce((s,k)=>s+subH(k,false).h,0)+(kids.length-1)*18;
          let cy = pos[b.id].y - ct/2;
          kids.forEach(k=>{
            const kh = subH(k,false).h;
            const kEdge = pos[b.id].x + dir*((nw[b.id]||80)/2);
            pos[k.id] = {x:kEdge + dir*(90 + (nw[k.id]||60)/2), y:cy+kh/2};
            cy += kh+18;
          });
        }
        y += bh+18;
      });
    }
    place(rights,1); place(lefts,-1);
  }
  function render(){
    const nEl=$('#nodes'); nEl.innerHTML='';
    visible().forEach(n=>{
      const el=document.createElement('div');
      el.className='node'+(n.root?' root':'');
      if(n.fill)el.classList.add('fill-'+n.fill);
      if(selected.has(n.id))el.classList.add('selected');
      if(n.hit)el.classList.add('search-hit');
      el.dataset.id=n.id;
      el.innerHTML='<span class="ntext"></span>';
      el.querySelector('.ntext').textContent=n.text;
      const p=pos[n.id]; el.style.left=p.x+'px'; el.style.top=p.y+'px';
      el.addEventListener('mousedown',e=>{if(e.button===0){e.shiftKey?(selected.has(n.id)?selected.delete(n.id):selected.add(n.id)):(selected=new Set([n.id]));sync();}});
      el.addEventListener('dblclick',e=>{e.stopPropagation();editNode(n);});
      el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();openMenu(e,n);});
      nEl.appendChild(el);
    });
    renderToggles(); renderEdges(); sync();
  }
  function renderToggles(){
    const tEl=$('#toggles'); tEl.innerHTML='';
    visible().filter(n=>(n.children||[]).length).forEach(n=>{
      const p=pos[n.id],dir=n.side==='left'?-1:1;
      const half = (nw[n.id]||80)/2;
      const b=document.createElement('button'); b.className='btoggle'+(n.collapsed?' collapsed':'');
      b.style.left=(p.x+dir*(half+22))+'px'; b.style.top=p.y+'px';
      // 语义对齐 BranchToggleAtlas.label：折叠态「＋N」（点击展开），展开态「−」（点击折叠）
      b.textContent = n.collapsed ? ('＋'+(countDesc(n)||'')) : '−';
      b.addEventListener('mousedown',e=>{e.stopPropagation();n.collapsed=!n.collapsed;refresh();});
      tEl.appendChild(b);
    });
  }
  function renderEdges(){
    const el=$('#edgeL');
    el.style.display='block';
    el.setAttribute('viewBox','-1000 -600 2000 1200');
    let path = el.querySelector('path') || document.createElementNS('http://www.w3.org/2000/svg','path');
    el.appendChild(path);
    let d='';
    visible().filter(n=>!n.root).forEach(n=>{
      const p=parentOf(n),pp=pos[p.id],cp=pos[n.id],dir=n.side==='left'?-1:1;
      const sx=pp.x+dir*((nw[p.id]||80)/2), sy=pp.y;
      const ex=cp.x-dir*((nw[n.id]||80)/2), ey=cp.y, mx=(sx+ex)/2;
      d+=`M${sx},${sy} C${mx},${sy} ${mx},${ey} ${ex},${ey} `;
    });
    path.setAttribute('d',d);
    path.setAttribute('stroke', '#6d7568');
    path.setAttribute('stroke-width','1.8');
    path.setAttribute('fill','none');
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('stroke-opacity','0.7');
  }
  // 树结构/内容变化后：先按旧布局渲染以测量真实节点宽 → 宽感知重排 → 重渲染
  function refresh(){ render(); measure(); relayout(); render(); }
  function parentOf(n){return flat.find(p=>(p.children||[]).includes(n));}
  function sync(){
    $('#addChild').disabled=!selected.size;
    $('#addSibling').disabled=!selected.size;
    $('#del').disabled=!selected.size;
    $('#setLeft').disabled=!selected.size;
    $('#setRight').disabled=!selected.size;
    // swatch active state
    const fills=[...selected].map(id=>flat.find(x=>x.id===id)?.fill);
    const active = fills.length && fills.every(f=>f===fills[0]) ? fills[0] : (fills.length?null:undefined);
    document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on', active!==undefined && s.dataset.fill===(active||'')));
  }
  function editNode(n){const t=prompt('编辑文字',n.text);if(t!==null){n.text=t;render();}}
  let clip=null, menuEl=$('#ctx');
  function openMenu(e,n){
    const sel=selected.has(n.id)?selected:new Set([n.id]);
    const isMulti=sel.size>1;
    const items=[
      {t:'添加子主题',k:'Tab',fn:()=>{const c={id:'n'+Math.random(),text:'新主题',children:[]};n.children.push(c);flat=all(ROOT);refresh();}},
      {t:'添加同级主题',k:'⏎',fn:()=>{const p=parentOf(n);if(p){p.children.push({id:'n'+Math.random(),text:'新主题',children:[]});flat=all(ROOT);refresh();}}},
      {t:'编辑…',k:'Enter',fn:()=>editNode(n)},
      {sep:1},
      {t:'剪切',k:'⌘X',d:!sel.size,fn:()=>{clip=[...sel];}},
      {t:'复制',k:'⌘C',d:!sel.size,fn:()=>{clip=[...sel];}},
      {t:'粘贴',k:'⌘V',d:!clip,fn:()=>pasteAsChild(n)},
      {sep:1},
      {t:'移到左侧',k:'⌘←',d:!sel.size,fn:()=>setSide(sel,'left')},
      {t:'移到右侧',k:'⌘→',d:!sel.size,fn:()=>setSide(sel,'right')},
      {sep:1},
      {t:'填色 ▸',sub:true},
      ...[['sage','鼠尾草'],['sky','天蓝'],['sand','沙金'],['rose','玫瑰'],['lilac','丁香']].map(([f,lab])=>({t:lab,ind:1,fn:()=>setFill(sel,f)})),
      {t:'清除填色',ind:1,fn:()=>setFill(sel,null)},
      {sep:1},
      {t:isMulti?`删除 ${sel.size} 项`:'删除',k:'Delete',danger:true,fn:()=>del(sel)},
    ];
    let h=''; const acts=[];
    items.forEach(it=>{
      if(it.sep){h+='<div class="csep"></div>';return;}
      h+=`<button class="${(it.danger?'danger ':'')}" ${it.d?'disabled':''} ${it.ind?'style="padding-left:24px"':''}>
        <span>${it.sub?it.t:it.t}</span>${it.k?`<span class="kbd">${it.k}</span>`:''}</button>`;
      acts.push(it);
    });
    menuEl.innerHTML=h; menuEl.classList.add('show');
    menuEl.style.left=e.clientX+'px'; menuEl.style.top=e.clientY+'px';
    menuEl.querySelectorAll('button:not(:disabled)').forEach(b=>{b.addEventListener('click',()=>{menuEl.classList.remove('show');acts[0].fn&&null;});});
    // simpler: index by filter
    const fns=items.filter(x=>!x.sep);
    menuEl.querySelectorAll('button:not(:disabled)').forEach((b,i)=>{b.addEventListener('click',()=>{menuEl.classList.remove('show');fns[i].fn&&fns[i].fn();});});
  }
  function pasteAsChild(n){if(!clip)return;clip.forEach(id=>{const src=flat.find(x=>x.id===id);if(src)n.children.push({...src,children:[]});});clip=null;flat=all(ROOT);refresh();}
  function setSide(sel,side){flat.forEach(n=>{if(sel.has(n.id))n.side=side;});refresh();}
  function setFill(sel,f){flat.forEach(n=>{if(sel.has(n.id))n.fill=f;});render();}
  function del(sel){
    const remove=(list,ids)=>{for(let i=list.length-1;i>=0;i--){const c=list[i];if(ids.has(c.id))list.splice(i,1);else remove(c.children,ids);}};
    remove(ROOT.children,sel);flat=all(ROOT);selected.clear();refresh();
  }
  document.addEventListener('mousedown',e=>{if(!menuEl.contains(e.target))menuEl.classList.remove('show');});

  // toolbar
  $('#addChild').onclick=()=>{const t=flat.find(x=>x.id==='root');t.children.push({id:'n'+Math.random(),text:'新主题',children:[]});flat=all(ROOT);refresh();};
  $('#addSibling').onclick=()=>{const n=flat.find(x=>selected.has(x.id))||ROOT;const p=parentOf(n)||ROOT;p.children.push({id:'n'+Math.random(),text:'新主题',children:[]});flat=all(ROOT);refresh();};
  $('#del').onclick=()=>{if(selected.size)del(selected);};
  $('#setLeft').onclick=()=>{if(selected.size)setSide(selected,'left');};
  $('#setRight').onclick=()=>{if(selected.size)setSide(selected,'right');};

  // zoom
  let scale=1;
  function applyZoom(){const w=$('#world');w.style.transform=`scale(${scale})`;$('#zoomLabel').textContent=Math.round(scale*100)+'%';}
  $('#zoomIn').onclick=()=>{scale=Math.min(4,scale*1.15);applyZoom();};
  $('#zoomOut').onclick=()=>{scale=Math.max(.2,scale/1.15);applyZoom();};
  $('#fit').onclick=()=>{scale=1;applyZoom();};
  $('#fitPill').onclick=()=>{scale=1;applyZoom();};
  $('#stage').addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.2,Math.min(4,scale*(e.deltaY<0?1.1:.9)));applyZoom();},{passive:false});

  // pills
  $('#themePill').onclick=()=>{const d=document.documentElement;const dark=d.getAttribute('data-theme')==='dark';
    d.setAttribute('data-theme',dark?'light':'dark');$('#themePill').textContent=dark?'☀️ 亮色模式':'暗色模式';};
  let searchOpen=false;
  $('#searchPill').onclick=()=>{searchOpen=!searchOpen;
    $('#searchPill').classList.toggle('on',searchOpen);
    if(searchOpen){$('#sinput')?.focus();}else{flat.forEach(n=>n.hit=false);render();}};

  // hint
  setTimeout(()=>$('#hint').classList.add('show'),600);
  setTimeout(()=>$('#hint').classList.remove('show'),6000);

  // swatches
  $('#swatches').addEventListener('click',e=>{
    const sw=e.target.closest('.sw');if(!sw)return;
    const f=sw.dataset.fill||null;
    if(selected.size)setFill(selected,f);else{ROOT.fill=f;render();}
  });
  $('#moreBtn').onclick=(e)=>{openMenu(e,{...ROOT,children:ROOT.children});};

  // 两遍布局：先按初值渲染测量真实节点宽 → 宽感知重排 → 重渲染
  render();
  measure();
  relayout();
  render();
})();
</script>
