<h2>括号树 — 按参考 HTML 的 JS 几何忠实实现</h2>

<div class="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px">

      <svg viewBox="0 0 240 230">

        <g stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M116 50 Q98 50, 98 66 L98 94 Q98 110, 78 110" stroke="#FAC646"/>
          <path d="M78 110 Q98 110, 98 126 L98 154 Q98 170, 116 170" stroke="#E36953"/>
        </g>
        <!-- 父→嘴 -->
        <path d="M74 110 H78" stroke="#E36953" stroke-width="3.2" stroke-linecap="round"/>
        <g fill="#fff" stroke="#121A5A" stroke-width="2">
          <rect x="4" y="90" width="70" height="40" rx="10" fill="#fff"/>
        </g>
        <g fill="#fff" stroke="#26221b" stroke-width="1">

          <text x="162" y="54" fill="#1A1A1A">子1</text>
          <text x="162" y="114" fill="#fff">子2</text>

      </svg>
    </div>
    <div class="card-body">
      <h3>主括号（双色）</h3>
      <p>父左、括号撑满子列、3 子竖排右侧、父垂直居中、子不连边</p>
      <span class="tag rec">对齐参考 HTML</span>

  </div>

  <div class="card" data-choice="brace-sub" onclick="toggleSelect(this)">

      <svg viewBox="0 0 240 240">

        <g stroke="#FAC646" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">

        </g>

        <path d="M60 100 H40" stroke="#FAC646" stroke-width="3" stroke-linecap="round"/>
        <g fill="#fff" stroke="#26221b" stroke-width="1">

    <div class="card-body">
      <h3>子括号（单色 + 小圆圈）</h3>
      <p>父分支 → 子括号 → 3 细分竖排右侧；嘴旁小圆圈；子不连边</p>

</div>
