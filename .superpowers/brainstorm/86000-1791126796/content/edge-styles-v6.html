<h2>大括号修正 — 小曲线 + 长直 spine + 中点(嘴)</h2>
<p class="subtitle">按你给的参考代码：上下端小曲线，中段<b>竖直直线</b>，中点朝父的「嘴」。应用到父+2子。</p>

<div class="cards">

    <div class="card-image">
      <svg viewBox="0 0 200 360">
        <!-- 大括号：小曲线+长直spine+中点(嘴) -->
        <g stroke="#d69a2a" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- 上端小曲线 + 长直spine + 折入中点 -->
          <path d="M90 20 C74 20, 70 28, 70 45 L70 155 C70 172, 62 180, 45 180"/>
          <!-- 折出中点 + 长直spine + 下端小曲线 -->
          <path d="M45 180 C62 180, 70 188, 70 205 L70 315 C70 332, 74 340, 90 340"/>
          <!-- 父→中点(嘴) -->
          <path d="M42 180 H45"/>

          <path d="M70 99 H124"/>
          <path d="M70 261 H124"/>
        </g>
        <g fill="#fff" stroke="#26221b" stroke-width="1">
          <rect x="2" y="165" width="40" height="30" rx="7" fill="#26221b"/>

          <text x="150" y="103">子1</text>
          <text x="150" y="265">子2</text>

        <text x="150" y="350" font-size="10" fill="#9a5b1f" text-anchor="middle">小曲线+长直spine+中点(嘴)+直线接子</text>
      </svg>
    </div>
    <div class="card-body">
      <h3>括号图（按参考代码）</h3>
      <p>上下小曲线、中段竖直直线、中点朝父「嘴」、直线接子</p>
