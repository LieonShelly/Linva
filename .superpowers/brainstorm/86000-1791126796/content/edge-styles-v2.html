<style>
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .card { display: flex; flex-direction: column; }
  .card-image svg { width: 100%; height: auto; display: block; background: #fff; border-radius: 8px; border: 1px solid #e2ddd2; }
  svg text { font-family: -apple-system, "PingFang SC", sans-serif; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-top: 4px; }
  .tag.rec { background: #e8e3d8; color: #6e685c; }
</style>

<h2>大括号修正 — 带中点尖钩的真花括号</h2>
<p class="subtitle">按你的参考图，括号应为经典花括号：竖脊柱 + <b>中点尖钩</b> + 上下对称弧。请确认形状 + 选组括号 / 每条边。</p>

<div class="cards">

  <div class="card" data-choice="symbol" onclick="toggleSelect(this)">
    <div class="card-image">
      <svg viewBox="0 0 200 200">
        <g stroke="#26221b" stroke-width="9" fill="none" stroke-linecap="round">
          <path d="M150 30 C105 30, 105 100, 88 100"/>
          <path d="M88 100 C105 100, 105 170, 150 170"/>
        </g>
      </svg>
    </div>
    <div class="card-body">
      <h3>括号符号（形状确认）</h3>
      <p>竖脊柱 + 中点尖钩朝开口侧 + 上下对称弧（对齐你的参考图）</p>
      <span class="tag rec">形状基准</span>
    </div>
  </div>

          <path d="M228 227 C218 227, 218 264, 196 264"/>
          <path d="M228 197 H272"/><path d="M228 257 H272"/>
        </g>
        <g fill="#fff" stroke="#b85c3a" stroke-width="1">
          <rect x="18" y="135" width="58" height="30" rx="7" fill="#26221b"/>

          <text x="294" y="261">b2</text>

      </svg>
    </div>
    <div class="card-body">
      <h3>组括号 · 括号图（对齐 XMind）</h3>

      <span class="tag rec">最像 XMind 括号图</span>

  </div>
