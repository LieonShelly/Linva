                  - generic [ref=f14e168]: aisuc.
              - generic [ref=f14e170]:
                - generic [ref=f14e171]:
                  - paragraph [ref=f14e172]: 近几天试用了很多款脑图软件，觉得你们的软件是比较好的，UI简洁，操作简单没有那么绕绕的。但是比较不好的一点就是，你们是月度、年度订阅制的，而不是一次性订阅制，我有注意到你们给其他人的回复，说是为维护开放的必要成本，为后续更好的维护支持。我赞同订阅者对开发者的支持，为优秀的软件付费，是对的事情，优秀开发者也值得。但是，我观察，你们的软件并非较多更新，观察功能，云同步是iCloud，是用户付费，而不是你们支付成本，ai功能你们说使用的苹果智能，可中国用户并不能用，你们的订阅制却要用户承担着一部分多余成本，在我看来，现在的订阅制，更像是开发者想要一只会持续下蛋的鸡，想榨干一只鸡的生命而不是去养更多的鸡。本质是你们创作思维枯竭，没有对未来持续推出更多优秀内容的信心。留意到你们对一些用户的回复，你们回复说祝愿那些批评你们订阅者找到其他合适的工具，这一点我很费解，实际上用户是愿意支持你们的，但你们的回复却没有人情味。一次性订阅制我认为不会给你们造成损失，反而会带来机遇，因为会有更多用户使用你们的产品。如果你们的某项服务可能会造成持续成本，你们完全可以采取一次性订阅+额外服务的模式，把持续支出的服务跟一次性订阅剥离，采取积分的模式来使用额外的服务，一次性订阅制用户可以每月赠送一定量积分，也可以额外购买更多的积分，如果你们的这些服务足够好，我相信会有人持续来购买积分。有很多软件都是如此。事实证明他们拥有更多用户和支持者。我认为，你们这样会是比现在更好的模式，它会更加激励你们团队来保持健康的创新状态。以上希望你们能考虑，如果你们更改为一次性订阅，我将不加犹豫，果断支持。谢谢。
                  - button "更多" [ref=f14e173] [cursor=pointer]
                - generic [ref=f14e174]:
                  - text: 开发者回复
                  - generic [ref=f14e175]:
                    - paragraph [ref=f14e176]: "你好，非常感谢你如此详细地分享你的反馈！我们非常重视这样的建设性意见，也能理解你所提出的这些观点。我也理解，订阅模式并不适合所有用户。请放心，我们的定价是根据维持公司正常运营以及覆盖持续产生的各项成本所需要的水平来制定的。我们的目标并不是向用户收取超出必要范围的费用。如果你觉得 MindNode 的更新频率还不够高，我对此感到抱歉。事实上，在过去几个月里，我们一直在努力每 2–4 周发布一次更新。你可以在我们的版本更新记录中查看更多关于最新更新的详细信息。关于 iCloud 的成本问题，我也理解你的观点。对于 MindNode Next，我们投入了大量的时间、精力和资源来开发一款全新的应用。它将数据存储在 CloudKit 中，从而让用户可以更加方便地在不同设备之间访问自己的文档，同时也能够与 Apple 生态系统进行更紧密的整合。AI 功能和 Apple Intelligence 也是如此。很抱歉，目前其中一些功能还无法在中国使用。我们了解这一限制，也希望未来能够让更多地区的用户使用这些功能。目前，我们也正在开发一些规模较大、需要投入较多时间的功能，例如协作（Collaboration）和 AI。我也很想了解，你希望在 MindNode 中看到哪些新的或更具创意的功能。如果你有任何想法，非常欢迎通过 support@mindnode.com 与我们分享。这样的反馈对我们的团队非常有帮助。关于你提出的其他付费模式，我完全理解你的想法。不过，从客户支持的角度来看，我可以告诉你，应用内购买实际上有时会给用户带来更多的困扰和不满。我们也希望用户能够完整使用 MindNode 的各项功能，而不是在使用过程中不断遇到额外的付费墙或功能限制。再次感谢你愿意花时间分享这些想法。我会将你的反馈转达给我们的团队，我们也一定会在内部进行讨论！（请注意：以上内容由 AI 翻译，仅供参考。）Original:Hi,Thank you so much for your detailed feedback! We really appreciate constructive feedback like this, and I understand the points you’re making. I also understand that a subscription model isn’t for everyone.Please rest assured that we set our prices based on what we need to keep the company running and cover our ongoing costs. Our goal is not to charge more than necessary.I’m sorry if you feel that the app isn’t updated frequently enough. Over the past couple of months, we’ve actually been trying to release updates every 2–4 weeks. You can find more details about our latest updates in our release notes.I also understand your point regarding iCloud. With MindNode Next, we’ve invested a lot of time, effort, and resources into building a completely new app that stores its data in CloudKit. This allows us to make your documents more easily accessible across your devices while keeping everything tightly integrated with the Apple ecosystem.The same applies to our AI features and Apple Intelligence. I’m sorry that some of these features aren’t currently available in China. We’re aware of this limitation and hope to make them available to more users in the future.At the moment, we’re also working on some larger and more time-consuming features, such as Collaboration and AI. I’d be curious to hear what kind of new or more creative features you would like to see in MindNode. Feedback like this is always very helpful for our team, so please feel free to share your ideas with us at support@mindnode.com.Regarding your idea for a different payment model: I completely understand where you’re coming from. From a support perspective, though, I can tell you that in-app purchases can actually cause even more frustration for users. We also want our users to have full access to MindNode’s features without constantly running into additional paywalls or limitations.Thank you again for taking the time to share your thoughts. I’ll pass your feedback on to the team, and we’ll definitely discuss it internally!"
                    - button "更多" [ref=f14e177] [cursor=pointer]
