                - paragraph [ref=f14e198]: 付费了还用不了会员功能，动不动就闪退，害得我做好的资料都没有了，又退不了钱，能不能换个能中文的人沟通，有问题还要英文沟通，想赚中国人的钱能不能按中文走
                - generic [ref=f14e199]:
