              - generic [ref=f14e272]:
                - generic [ref=f14e273]:
                  - paragraph [ref=f14e274]: 个人认为新版本相比旧版本是明显退步，具体反馈如下： 1. 手机端功能退化，原本可删除单个节点的功能现在无法使用； 2. 默认浅色背景难看，希望恢复旧版本的背景颜色； 3. 升级后旧版本无法使用，只能强制使用体验不佳的新版本；建议技术开发组从用户使用角度重新优化产品，保留上一版本的功能和配色。
                  - button "更多" [ref=f14e275] [cursor=pointer]
                - generic [ref=f14e276]:
                  - text: 开发者回复
                  - generic [ref=f14e277]:
                    - paragraph [ref=f14e278]: "Thank you very much for taking the time to share such detailed feedback with us. We truly appreciate when users like you let us know what works well and what could be improved.Please note that you can still delete individual nodes on iOS by tapping the node and choosing Delete from the menu.Your suggestion regarding the background color is a great idea, and we'll discuss it with the team.And if prefer the previous version, you can continue to use MindNode Classic through the following link: https://apps.apple.com/app/mindnode-classic/id1289197285?ct=web-blog-dl&mt=12"
