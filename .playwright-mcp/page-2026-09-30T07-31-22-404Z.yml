                  - generic [ref=f14e200]:
                    - paragraph [ref=f14e201]: "AI translated response (see original below): 很抱歉得知您遇到了这些问题。这确实不应该发生，我们很乐意进一步帮您调查和解决。请您通过电子邮件 support@mindnode.com 再次联系我们，并提供以下信息：打开 MindNode 中的 设置（Settings）。向下滚动到底部。长按底部显示应用版本和版权信息的区域。上方的列表中应该会出现一个新的选项 Support Tools（支持工具）。请点击进入。在 CLOUD SYNC LOGS（云同步日志） 下，点击 Share with Support（与支持团队共享）。这些日志将帮助我们进一步调查您遇到的问题。在许多情况下，丢失的文档也可以通过 iCloud.com 中的 数据恢复（Data Recovery） 功能找回。关于您的退款申请，请直接联系 Apple，因为我们的订阅付款和相关服务均由 Apple 负责处理。再次对给您带来的不便表示歉意。收到支持日志后，我们会很乐意进一步调查这个问题。Original wirtten response: I’m sorry to hear that you’re running into these issues. This definitely shouldn’t be happening, and we’d be happy to look into it further.Could you please get back in touch with us by email support@mindnode.com and provide the following information?1. Open Settings in MindNode.2. Scroll all the way down.3. Long-press on the section at the bottom where the app version and copyright information are displayed.4. A new option called Support Tools should appear in the list above. Tap on it.5. Under CLOUD SYNC LOGS, tap Share with Support.This will provide us with the logs we need to investigate the issue.In many cases, lost documents can also be recovered through iCloud.com using the Data Recovery feature.Regarding your refund request, please contact Apple directly, as Apple handles all payments and fulfillment for our subscriptions.We’re sorry again for the trouble, and we’ll be happy to investigate the issue once we receive the support logs."
